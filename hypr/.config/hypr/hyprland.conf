
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# Theme colors - managed by hypr-concierge theme switcher
source = ~/.config/hyprland-themes/current/colors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto

# Disable laptop monitor when lid is closed, re-enable when opened
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, preferred, auto, 1.5"


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = ghostty -e yazi
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = bash ~/.local/bin/waybar-wrapper
exec-once = hyprpaper
exec-once = handle-monitor-change
exec-once = wl-paste --watch cliphist store
exec-once = mako
exec-once = hypridle


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# XWayland app scaling (for apps like OrcaSlicer, Steam, etc.)
# With force_zero_scaling=true, apps render at native res and handle their own scaling
# GDK_DPI_SCALE must match the Hyprland scale of the active display:
#   - Laptop (eDP-1) at scale 1.5 → GDK_DPI_SCALE=1.5
#   - External monitor at scale 1.0 → GDK_DPI_SCALE=1
env = GDK_DPI_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_SCALE_FACTOR_ROUNDING_POLICY,RoundPreferFloor

# Use portal file dialogs for GTK3 apps (enables yazi filepicker)
env = GTK_USE_PORTAL,1

# XWayland settings - render at native resolution for sharper text
xwayland {
    force_zero_scaling = true
}


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    # Theme colors sourced from ~/.config/hyprland-themes/current/colors.conf

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Tearing enabled for gaming (only applies to windows with 'immediate' rule)
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

# https://wiki.hypr.land/Configuring/Variables/#render
render {
    direct_scanout = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, W, exec, ~/.local/bin/hypr-undo-close close
bind = $mainMod, Z, exec, ~/.local/bin/hypr-undo-close pop
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, R, exec, $menu
bind = $mainMod, Space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
# Keybindings menu
bind = $mainMod, K, exec, ~/.local/bin/keybinds-menu
# Clipboard history
bind = $mainMod SHIFT, V, exec, ~/.local/bin/cliphist-rofi
bind = $mainMod, A, exec, ghostty -e ~/.local/bin/audio-picker
bind = $mainMod, B, exec, ghostty --title=bluetooth -e bluetui
# Theme switcher
bind = $mainMod ALT, T, exec, ~/.local/bin/theme-rofi
# Meeting launcher
bind = $mainMod SHIFT, M, exec, ~/.local/bin/meeting-launcher

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows with mainMod + SHIFT + arrow keys
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Move window to monitor with mainMod + CTRL + arrow keys
bind = $mainMod CTRL, left, movewindow, mon:l
bind = $mainMod CTRL, right, movewindow, mon:r

# Resize windows with mainMod + ALT + arrow keys
binde = $mainMod ALT, left, resizeactive, -50 0
binde = $mainMod ALT, right, resizeactive, 50 0
binde = $mainMod ALT, up, resizeactive, 0 -50
binde = $mainMod ALT, down, resizeactive, 0 50

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, A, exec, chromium --app=https://claude.ai
bind = $mainMod SHIFT, B, exec, chromium
bind = $mainMod SHIFT, M, exec, ~/.local/bin/launch-or-focus 'Page Load Targets' 'chromium --app=https://grafana.taild0ac70.ts.net/d/tomes-page-load-targets/tomes-e28094-page-load-targets'
bind = $mainMod SHIFT, T, exec, pgrep -x btop && hyprctl dispatch focuswindow title:btop || $terminal --title=btop -e btop
bind = $mainMod SHIFT, N, exec, $terminal -e nvim
bind = $mainMod SHIFT, D, exec, discord --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod SHIFT, L, exec, wl-paste | tr -d '\n' | wl-copy

# Universal copy/paste (Ctrl+Insert / Shift+Insert work everywhere)
bind = $mainMod, C, sendshortcut, CTRL, Insert, activewindow
bind = $mainMod, V, sendshortcut, SHIFT, Insert, activewindow
bind = $mainMod, X, sendshortcut, CTRL, X, activewindow

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Screenshots - to clipboard
# NOTE: -t image/png is required. Without it wl-copy shells out to xdg-mime
# for type detection, which calls xprop, which hangs indefinitely because
# XWayland is currently broken in this Hyprland session. See ~/CLAUDE.md
# Hardware Notes for the XWayland issue.
# Default Print: hover a window to snap-select it, click-drag for free-form region.
bind = , Print, exec, /home/cwar/.local/bin/screenshot-smart copy
bind = SHIFT, Print, exec, grim - | wl-copy -t image/png
bind = CTRL, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy -t image/png
bind = $mainMod, Print, exec, /home/cwar/.local/bin/screenshot-smart save
# Screenshots - open in Satty (add Super to open in Satty)
bind = ALT, Print, exec, /home/cwar/.local/bin/screenshot-smart satty
bind = $mainMod SHIFT, Print, exec, grim - | satty --filename -
bind = $mainMod CTRL, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | satty --filename -
bind = $mainMod ALT, Print, exec, wl-paste | satty --filename -

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Power menu (shutdown, restart, lock, sleep, etc.)
bind = $mainMod, Escape, exec, ~/.local/bin/power-menu

# Lazygit (opens in focused terminal's cwd)
bind = $mainMod SHIFT, G, exec, ~/.local/bin/launch-lazygit

# Keyboard mouse control
bind = $mainMod, G, exec, wl-kbptr
bind = $mainMod CTRL, G, exec, pkill wl-kbptr

# Claude Code session picker
bind = $mainMod SHIFT, R, exec, /home/cwar/.local/bin/claude-sessions

# Screencast (toggle start/stop) — wf-recorder + mic via screencast-smart
# Super+Alt+R       : fullscreen + mic
# Super+Alt+Ctrl+R  : fullscreen, no mic
bind = $mainMod ALT, R, exec, /home/cwar/.local/bin/screencast-smart full mic
bind = $mainMod ALT CTRL, R, exec, /home/cwar/.local/bin/screencast-smart full nomic

# Claude Code project picker — new ghostty running claude-projects
bind = $mainMod SHIFT, P, exec, ghostty --title=claude-projects -e /home/cwar/.local/bin/claude-projects

# Toggle monitor input (HDMI1/HDMI2)
bind = $mainMod SHIFT, I, exec, ~/.local/bin/samsung-input-toggle

# Claude Insights browser
bind = $mainMod ALT, I, exec, ~/.local/bin/claude-insights rofi

# Showcase - browse personal tweaks & projects
bind = $mainMod ALT, S, exec, ~/.local/bin/showcase rofi

# Weather TUI
bind = $mainMod SHIFT, W, exec, $terminal --title=weather -e ~/.local/bin/weather-tui

# Quickshell toggle (custom QML bar)
bind = $mainMod ALT, Q, exec, ~/.local/bin/quickshell-toggle

# Quickshell lock — keep Super+L on hyprlock until confident with Quickshell lock
bind = $mainMod ALT, L, exec, ~/.local/bin/quickshell-lock

# Quickshell K8s sidebar (requires quickshell running)
bind = $mainMod ALT, K, exec, ~/.local/bin/k8s-sidebar-toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule (Hyprland 0.53+ syntax)
# windowrule = match:class ^(kitty)$, match:title ^(kitty)$, float on

# Ignore maximize requests from apps. You'll probably like this.
windowrule = match:class .*, suppress_event maximize

# Fix some dragging issues with XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland yes, match:float yes, match:fullscreen no, match:pin no, no_focus on

# btop floating and centered
windowrule = match:title ^(btop)$, float on
windowrule = match:title ^(btop)$, size 80% 80%
windowrule = match:title ^(btop)$, center on

# lazygit floating and centered
windowrule = match:title ^(lazygit)$, float on
windowrule = match:title ^(lazygit)$, size 90% 90%
windowrule = match:title ^(lazygit)$, center on

# sysupdate popup
windowrule = match:title ^(sysupdate)$, float on
windowrule = match:title ^(sysupdate)$, size 70% 70%
windowrule = match:title ^(sysupdate)$, center on

# yazi file picker (xdg-desktop-portal-termfilechooser)
windowrule = match:class ^(yazi-selector)$, float on
windowrule = match:class ^(yazi-selector)$, size 80% 80%
windowrule = match:class ^(yazi-selector)$, center on

# Wallpaper preview (hypr-concierge theme skill)
windowrule = match:title ^(.*Wallpaper Preview.*)$, float on
windowrule = match:title ^(.*Wallpaper Preview.*)$, size 70% 80%
windowrule = match:title ^(.*Wallpaper Preview.*)$, center on

# Hackers screensaver - fullscreen mpv video on each monitor
windowrule = match:title ^(hackers-screensaver-.*)$, fullscreen on
windowrule = match:title ^(hackers-screensaver-.*)$, no_blur on
windowrule = match:title ^(hackers-screensaver-.*)$, no_shadow on
windowrule = match:title ^(hackers-screensaver-.*)$, decorate off
windowrule = match:title ^(hackers-screensaver-.*)$, no_anim on
windowrule = match:title ^(hackers-screensaver-eDP-1)$, monitor eDP-1
windowrule = match:title ^(hackers-screensaver-HDMI-A-1)$, monitor HDMI-A-1

# cwarch screensaver - fullscreen TTE text effects
windowrule = match:class ^(org\.cwarch\.screensaver)$, fullscreen on
windowrule = match:class ^(org\.cwarch\.screensaver)$, no_blur on
windowrule = match:class ^(org\.cwarch\.screensaver)$, no_shadow on
windowrule = match:class ^(org\.cwarch\.screensaver)$, decorate off

#############################
### STEAM & GAMING RULES ###
#############################

# Steam client - float the UI windows
windowrule = match:class ^(steam)$, match:title ^(Steam)$, float on
windowrule = match:class ^(steam)$, match:title ^(Steam)$, size 1100 700
windowrule = match:class ^(steam)$, match:title ^(Steam)$, center on
windowrule = match:class ^(steam)$, match:title ^(Friends List)$, float on
windowrule = match:class ^(steam)$, match:title ^(Friends List)$, size 460 800

# Steam games - fullscreen, opaque, no idle, tearing for low latency
windowrule = match:class ^(steam_app_.*)$, fullscreen on
windowrule = match:class ^(steam_app_.*)$, opacity 1.0 override 1.0 override
#windowrule = match:class ^(steam_app_.*)$, immediate on
windowrule = match:class ^(steam_app_.*)$, idle_inhibit always

# Also inhibit idle on the Steam client itself (e.g. during downloads/updates)
windowrule = match:class ^(steam)$, idle_inhibit focus

# GeForce NOW (Nvidia native flatpak — com.nvidia.GeForceNOW). Inhibit idle
# while focused so the screen doesn't blank mid-stream. Verify class matches
# with `hyprctl clients` after first launch — flatpaks conventionally use
# their reverse-DNS app-id as the Wayland app-id.
windowrule = match:class ^(com.nvidia.geforcenow)$, idle_inhibit focus

# Cursor fix — force software cursor (Intel i915 workaround)
cursor {
    no_hardware_cursors = true
}
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
