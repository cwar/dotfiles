# Shared by the Ubuntu and Arch laptops; colors may be overridden by theme.conf below.

# Prefix
unbind C-b
set -g prefix C-Space
#set -g prefix2 C-b  # removed: prefix is C-Space, not C-b
bind C-Space send-prefix

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi v send -X begin-selection
# Copy without dropping out of copy-mode, so scrollback position is preserved.
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi Enter send -X copy-selection-no-clear
# A plain click exits copy-mode cleanly so the pane doesn't stay stuck in COPY.
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection \; send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-selection-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-selection-no-clear

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane

bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# URL picker (prefix + u) - fzf popup with open/copy/copy-all
bind u run-shell -b "~/.local/bin/tmux-url-picker"

# Command picker (prefix + b) - fzf popup to extract bash snippets from scrollback
# Use the same run-shell + fzf-tmux path as prefix+u. Plain fzf inside
# display-popup can exit immediately with "inappropriate ioctl for device".
bind b run-shell -b "TMUX_CMD_PICKER_DEBUG=1 TMUX_PANE='#{pane_id}' ~/.local/bin/tmux-cmd-picker"

# Clean copy (prefix + y) - strip TUI borders and rejoin soft-wrapped lines in clipboard
bind y run-shell -b "~/.local/bin/tmux-clean-copy"

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
# The tmux server starts before mise activates, so plugins need its stable shims path.
set-environment -g PATH "/home/cwar/.local/share/mise/shims:/home/cwar/.local/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin"
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Pass window titles through to the terminal (shows in Hyprland group tabs)
set -g set-titles on
set -g set-titles-string "#{?#{m:π*,#T},#T,#{?#{==:#{pane_current_command},npm},π #{s|/home/cwar|~|:pane_current_path},#{pane_current_command} #{s|/home/cwar|~|:pane_current_path}}}"

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#{?@ssh_host,#[fg=brightblack]#h → #[fg=yellow]#{@ssh_host} ,#[fg=brightblack]#h }"
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Per-machine palette (hypr-concierge rewrites it on Arch); -q: absence is fine.
source-file -q ~/.config/tmux/theme.conf
# After theme.conf so a palette cannot drop the mode/ssh indicators.
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#{?@ssh_host,#[fg=brightblack]#h → #[fg=yellow]#{@ssh_host} ,#[fg=brightblack]#h }"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'S'
set -g @sessionx-fzf-builtin-tmux 'on'

run '~/.config/tmux/plugins/tpm/tpm'
# Keep this after TPM so SessionX cannot overwrite the age-aware binding.
bind S run-shell "~/.local/bin/tmux-sessionx-aged"

# Refresh compositor vars on attach; the server outlives Plasma/niri logins.
set -ga update-environment "WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP NIRI_SOCKET"
