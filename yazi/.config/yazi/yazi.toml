[tasks]
micro_workers = 5      # Max concurrent micro tasks (default 10)
macro_workers = 10     # Max concurrent macro tasks (default 25)
bizarre_retry = 3      # Retry failed tasks (default 5)

[plugin]
prepend_fetchers = [
    # Extension-based MIME lookup — avoids per-file `file(1)` invocations
    # that backed up the micro-worker queue on large dirs / quirky files.
    { url = "local://*",  run = "mime-ext.local",  prio = "high", group = "mime" },
    { url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },
]
prepend_preloaders = [
    { url = "*.m4b", run = "mediainfo" },
    { mime = "{audio,video,image}/*", run = "mediainfo" },
]
prepend_previewers = [
    { url = "*.m4b", run = "mediainfo" },
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { url = "*.epub", run = "epub-preview" },
    { mime = "application/epub+zip", run = "epub-preview" },
]

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Edit in nvim" }
]
audio = [
    { run = 'mpv --no-video --msg-level=ffmpeg=error "$@"', block = true, desc = "Play audio" }
]
video = [
    { run = 'mpv "$@"', orphan = true, desc = "Play video" }
]
image = [
    { run = 'xdg-open "$@"', orphan = true, desc = "View image" }
]
epub = [
    { run = 'foliate "$@"', orphan = true, desc = "Read in Foliate" }
]
pdf = [
    { run = 'zathura "$@"', orphan = true, desc = "Read in Zathura" }
]
fallback = [
    { run = 'xdg-open "$@"', orphan = true, desc = "Open with default app" }
]

[open]
append_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-yaml", use = "edit" },
    { mime = "audio/*", use = "audio" },
    { url = "*.m4b", use = "audio" },
    { url = "*.m4a", use = "audio" },
    { mime = "video/*", use = "video" },
    { mime = "image/*", use = "image" },
    { url = "*.epub", use = "epub" },
    { mime = "application/epub+zip", use = "epub" },
    { mime = "application/pdf", use = "pdf" },
]
